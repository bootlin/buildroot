image boot.vfat {
        vfat {
            files = {
                    "Image",
                    "k3-am625-beagleplay.dtb",
                    "tiboot3.bin",
            }

            file tispl.bin {
                    image = tispl.bin_unsigned
            }

            file u-boot.img {
                    image = u-boot.img_unsigned
            }

            file extlinux/extlinux.conf {
                    image = extlinux.conf
            }
        }

        size = 64M
}

image u-boot-env.ext4 {
        ext4 {
            features = "^metadata_csum"
        }
        size = 64M
        empty = true
}

image sdcard.img {
        hdimage {
        }

        partition u-boot {
                partition-type = 0xC
                bootable = "true"
                image = "boot.vfat"
        }

        partition u-boot-env {
                partition-type = 0x83
                image = "u-boot-env.ext4"
        }

        partition data {
                partition-type = 0x83
                size = 2G
        }

}
